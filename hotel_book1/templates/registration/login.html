{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>StayEasy – Login</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: "Poppins", sans-serif;
            overflow: hidden;
        }

        /* Background video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Glass login card */
        .login-box {
            width: 420px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 18px;
            padding: 35px 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.35);
            color: white;
            margin: auto;
            margin-top: 7%;
            text-align: center;
        }

        .login-box h2 {
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        label {
            display: block;
            text-align: left;
            margin-top: 10px;
            font-size: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: none;
            outline: none;
            font-size: 15px;
        }

        .login-btn {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0049cc;
        }

        .register-link {
            margin-top: 15px;
            font-size: 14px;
        }

        .register-link a {
            color: #ffeb3b;
            font-weight: bold;
            text-decoration: none;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop id="bg-video">
    <source src="{% static 'videos/hotel_bg.mp4' %}" type="video/mp4">
</video>

<!-- LOGIN CARD -->
<div class="login-box">
    <h2>Login</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <button type="submit" class="login-btn">Login</button>

        <div class="register-link">
            Don’t have an account? <a href="/register/">Register</a>
        </div>
    </form>
</div>

</body>
</html>

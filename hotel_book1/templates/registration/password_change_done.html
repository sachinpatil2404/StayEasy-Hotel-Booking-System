{% extends "bookings/base_dashboard.html" %}
{% load static %}

{% block title %}Password Updated | StayEasy{% endblock %}

{% block extra_styles %}
<style>
.password-done-card {
  max-width: 460px;
  margin: 40px auto;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 36px 30px;
  border-radius: 20px;
  text-align: center;
  box-shadow: var(--shadow-md);
}

.done-icon {
  width: 70px;
  height: 70px;
  border-radius: 50%;
  background: rgba(16,185,129,0.12);
  color: #10b981;
  font-size: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 18px;
}

.done-title {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 6px;
}

.done-text {
  font-size: 14px;
  color: var(--text-muted);
  margin-bottom: 24px;
}

.btn-done-dashboard {
  display: inline-block;
  padding: 12px 24px;
  background: var(--primary-gradient);
  color: white !important;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 700;
  text-decoration: none;
  transition: opacity var(--transition);
}
.btn-done-dashboard:hover { opacity: 0.9; }
</style>
{% endblock %}

{% block content %}

<div class="password-done-card">
  <div class="done-icon">
    <i class="fa-solid fa-circle-check"></i>
  </div>
  <h2 class="done-title">Password Updated 🎉</h2>
  <p class="done-text">Your password has been successfully changed.</p>

  <a href="{% url 'dashboard' %}" class="btn-done-dashboard">
    Return to Dashboard →
  </a>
</div>

{% endblock %}

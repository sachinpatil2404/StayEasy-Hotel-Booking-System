{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – StayEasy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

  <style>
    /* Fullscreen crisp video background */
    #bg-video {
      position: fixed;
      top: -2%; left: -2%;
      width: 104%; height: 104%;
      object-fit: cover;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: -2;
    }

    /* Subtle Dark Overlay - NO BLUR so video stays 100% sharp & vivid */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.55) 100%);
      z-index: -1;
    }

    .title {
      font-weight: 800;
      font-size: 32px;
      text-align: center;
      color: #fff;
      margin-top: 40px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    /* Center semi-opaque card */
    .login-card {
      max-width: 460px;
      margin: 30px auto;
      background: rgba(15, 23, 42, 0.84);   /* Dark slate semi-opaque card */
      border-radius: 20px;
      padding: 36px 36px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: fadeIn 0.7s ease-out;
    }

    @keyframes fadeIn {
      from { opacity:0; transform: translateY(20px); }
      to { opacity:1; transform: translateY(0); }
    }

    .login-subtitle {
      font-size: 14px;
      color: #94a3b8;
      text-align: center;
      margin-bottom: 22px;
    }

    /* LOGIN TYPE TABS */
    .login-type-tabs {
      display: flex;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 9px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #4e63ff 0%, #0061ff 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(78, 99, 255, 0.35);
    }

    label {
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-control-lg {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff !important;
      font-size: 15px;
    }
    .form-control-lg:focus {
      background: rgba(30, 41, 59, 0.95);
      border-color: #4e63ff;
      box-shadow: 0 0 0 3px rgba(78, 99, 255, 0.25);
    }
    .form-control-lg::placeholder { color: #94a3b8; }

    .btn-login {
      background: linear-gradient(135deg, #4e63ff 0%, #0061ff 100%);
      color: white;
      width: 100%;
      padding: 13px;
      font-size: 16px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      transition: 0.25s;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(78, 99, 255, 0.35);
    }
    .btn-login:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .bottom-text {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .bottom-text a {
      font-weight: 700;
      color: #818cf8;
      text-decoration: underline;
    }

    @media (max-width: 576px) {
      .login-card {
        margin: 20px 15px;
        padding: 24px 20px;
      }
      .title {
        font-size: 24px;
        margin-top: 20px;
      }
    }
  </style>

</head>

<body>

<!-- 🌄 CRISP VIDEO BACKGROUND -->
<video autoplay muted loop id="bg-video">
  <source src="{% static 'videos/hotel2.mp4' %}" type="video/mp4">
</video>

<div class="overlay"></div>

<h1 class="title">Welcome Back to StayEasy</h1>

<!-- FORM CARD -->
<div class="login-card">

  <p class="login-subtitle">Sign in to your StayEasy account</p>

  <!-- ROLE SWITCHER TABS -->
  <div class="login-type-tabs">
    <button type="button" class="tab-btn active" id="tab-guest" onclick="switchLoginTab('guest')">
      <i class="fa-solid fa-user"></i> Guest Login
    </button>
    <button type="button" class="tab-btn" id="tab-manager" onclick="switchLoginTab('manager')">
      <i class="fa-solid fa-user-shield"></i> Hotel Manager
    </button>
  </div>

  <form method="post" autocomplete="off">
    {% csrf_token %}

    {% if messages %}
    {% for message in messages %}
      <div class="alert alert-{% if message.tags == 'error' or message.tags == 'danger' %}danger{% else %}{{ message.tags }}{% endif %}" style="border-radius:10px; font-size:13px;">
        {{ message }}
      </div>
    {% endfor %}
    {% endif %}

    <div class="mb-3">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control form-control-lg" placeholder="Enter your username" autocomplete="off" value="" required>
    </div>

    <div class="mb-3">
      <label for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control form-control-lg" placeholder="Enter your password" autocomplete="new-password" value="" required>
    </div>

    <button type="submit" class="btn btn-login" id="loginSubmitBtn">
      <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In as Guest
    </button>
  </form>

  <p class="bottom-text">
    Don't have an account? <a href="{% url 'register' %}">Create Account</a>
  </p>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const u = document.getElementById("id_username");
  const p = document.getElementById("id_password");
  if(u) u.value = "";
  if(p) p.value = "";
  setTimeout(function() {
    if(u) u.value = "";
    if(p) p.value = "";
  }, 150);
});

function switchLoginTab(type) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  const btn = document.getElementById("loginSubmitBtn");
  if(type === "guest") {
    document.getElementById("tab-guest").classList.add("active");
    if(btn) btn.innerHTML = '<i class="fa-solid fa-right-to-bracket me-1"></i> Sign In as Guest';
  } else {
    document.getElementById("tab-manager").classList.add("active");
    if(btn) btn.innerHTML = '<i class="fa-solid fa-shield-halved me-1"></i> Sign In as Hotel Manager';
  }
}
</script>

</body>
</html>

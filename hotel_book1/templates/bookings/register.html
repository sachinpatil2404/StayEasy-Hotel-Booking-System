{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account – StayEasy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">

  <style>
    /* Fullscreen crisp video background */
    #bg-video {
      position: fixed;
      top: -2%; left: -2%;
      width: 104%; height: 104%;
      object-fit: cover;
      transform: scale(1.08);
      transform-origin: center center;
      z-index: -2;
    }

    /* Subtle Dark Overlay - NO BLUR so video stays 100% sharp & vivid */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.35) 0%, rgba(0, 0, 0, 0.55) 100%);
      z-index: -1;
    }

    /* Sleek semi-opaque card for perfect contrast & zero video blur */
    .register-card {
      max-width: 520px;
      margin: 40px auto;
      background: rgba(15, 23, 42, 0.82);   /* Dark slate semi-opaque card */
      border-radius: 20px;
      padding: 36px 40px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      animation: fadeIn 0.7s ease-out;
    }

    @keyframes fadeIn {
      from { opacity:0; transform: translateY(20px); }
      to { opacity:1; transform: translateY(0); }
    }

    .title {
      font-weight: 800;
      font-size: 32px;
      text-align: center;
      color: #fff;
      margin-top: 30px;
      text-shadow: 0 4px 12px rgba(0,0,0,0.6);
    }

    label {
      font-weight: 600;
      color: #f1f5f9;
      margin-bottom: 6px;
    }

    /* ROLE SELECTION BUTTONS */
    .role-select-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .role-card-option {
      border: 2px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      color: #fff;
      user-select: none;
    }

    .role-card-option:hover {
      border-color: #4e63ff;
      background: rgba(78, 99, 255, 0.15);
    }

    .role-card-option.active {
      border-color: #4e63ff;
      background: rgba(78, 99, 255, 0.3);
      box-shadow: 0 0 15px rgba(78, 99, 255, 0.4);
    }

    .role-card-option i {
      font-size: 22px;
      margin-bottom: 4px;
      display: block;
      color: #818cf8;
    }

    .role-card-title {
      font-size: 13px;
      font-weight: 700;
    }

    .role-card-desc {
      font-size: 11px;
      opacity: 0.85;
    }

    .form-control-lg {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff !important;
      font-size: 15px;
    }
    .form-control-lg:focus {
      background: rgba(30, 41, 59, 0.95);
      border-color: #4e63ff;
      box-shadow: 0 0 0 3px rgba(78, 99, 255, 0.25);
    }
    .form-control-lg::placeholder { color: #94a3b8; }

    .btn-register {
      background: linear-gradient(135deg, #4e63ff 0%, #0061ff 100%);
      color: white;
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 12px;
      font-weight: 700;
      border: none;
      transition: 0.25s;
      box-shadow: 0 4px 15px rgba(78, 99, 255, 0.35);
    }

    .btn-register:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .bottom-text {
      text-align: center;
      margin-top: 18px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .bottom-text a {
      font-weight: 700;
      color: #818cf8;
      text-decoration: underline;
    }

    @media (max-width: 576px) {
      .register-card {
        margin: 20px 15px;
        padding: 24px 20px;
      }
      .title {
        font-size: 24px;
        margin-top: 20px;
      }
    }
  </style>

</head>

<body>

<!-- 🌄 CRISP VIDEO BACKGROUND -->
<video autoplay muted loop id="bg-video">
  <source src="{% static 'videos/hotel2.mp4' %}" type="video/mp4">
</video>

<div class="overlay"></div>

<h1 class="title">Create Your StayEasy Account</h1>

<!-- FORM CARD -->
<div class="register-card">

  <form method="post">
    {% csrf_token %}

    <!-- ROLE SELECTION -->
    <label>Account Type</label>
    <div class="role-select-grid">
      <label class="role-card-option active" id="opt-customer" onclick="setRole('customer')">
        <input type="radio" name="role" value="customer" checked style="display:none;">
        <i class="fa-solid fa-user"></i>
        <div class="role-card-title">Guest / Customer</div>
        <div class="role-card-desc">Book rooms</div>
      </label>

      <label class="role-card-option" id="opt-manager" onclick="setRole('manager')">
        <input type="radio" name="role" value="manager" style="display:none;">
        <i class="fa-solid fa-user-shield"></i>
        <div class="role-card-title">Hotel Manager</div>
        <div class="role-card-desc">Manage hotels</div>
      </label>
    </div>

    {% if form.errors %}
    <div class="alert alert-danger" style="border-radius:10px; font-size:13px;">
      {{ form.errors }}
    </div>
    {% endif %}

    <div class="mb-3">
      <label>Username</label>
      <input type="text" name="username" class="form-control form-control-lg" placeholder="Choose a username" required>
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" name="email" class="form-control form-control-lg" placeholder="name@example.com" required>
    </div>

    <div class="mb-3">
      <label>Phone Number</label>
      <input type="text" name="phone" class="form-control form-control-lg" placeholder="+91 98765 43210" required>
    </div>

    <div class="mb-3">
      <label>Password</label>
      <input type="password" name="password" class="form-control form-control-lg" placeholder="Create password" required>
    </div>

    <button class="btn btn-register">
      <i class="fa-solid fa-user-plus me-1"></i> Create Account
    </button>
  </form>

  <p class="bottom-text">
    Already have an account? <a href="{% url 'login' %}">Login</a>
  </p>

</div>

<script>
function setRole(role) {
  document.querySelectorAll(".role-card-option").forEach(opt => opt.classList.remove("active"));
  if(role === "customer") {
    document.getElementById("opt-customer").classList.add("active");
    document.querySelector("input[value='customer']").checked = true;
  } else {
    document.getElementById("opt-manager").classList.add("active");
    document.querySelector("input[value='manager']").checked = true;
  }
}
</script>

</body>
</html>

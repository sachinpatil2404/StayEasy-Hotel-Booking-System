{% extends "bookings/base_dashboard.html" %}
{% block content %}

<h2>Search Results for "{{ query }}"</h2>

{% if hotels %}
    <div style="display:flex; flex-wrap:wrap; gap:20px;">
        {% for hotel in hotels %}
            <div style="width:250px; background:white; padding:15px; border-radius:10px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
                
                <h3>{{ hotel.name }}</h3>
                <p>{{ hotel.city }}</p>

                <a href="{% url 'room_list' hotel.id %}"
                   style="display:inline-block; margin-top:10px; padding:8px 12px; background:#4e63ff; color:white; border-radius:6px;">
                   View Rooms
                </a>
            </div>
        {% endfor %}
    </div>
{% else %}
    <p>No hotels found.</p>
{% endif %}

{% endblock %}

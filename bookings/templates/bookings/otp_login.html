{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Email OTP Login</title>
</head>
<body>
<h2>Login with Email OTP</h2>

<form method="POST">
    {% csrf_token %}
    <label>Email:</label>
    <input type="email" name="email" required><br><br>

    <label>Password:</label>
    <input type="password" name="password" required><br><br>

    <button type="submit">Send OTP</button>
</form>

</body>
</html>

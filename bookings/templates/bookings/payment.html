{% extends "bookings/base_dashboard.html" %}
{% load static %}

{% block content %}
<div class="d-flex justify-content-center py-4">
    <div class="card p-4 shadow-sm border-0 text-center" style="width: 100%; max-width: 500px; border-radius: 16px;">
        <h2 class="fw-bold mb-3">Complete Payment</h2>

        <p class="text-muted">Scan the QR code below and pay <b>₹1</b> to confirm your booking.</p>

        <div class="my-3">
            <img src="{% static 'images/payment_qr.png' %}" style="max-width: 100%; width: 240px; height: auto;" class="img-fluid rounded shadow-sm" alt="Payment QR Code">
        </div>

        <form method="post" action="{% url 'payment_confirm' room.id %}">
            {% csrf_token %}

            <input type="hidden" name="check_in" value="{{ check_in }}">
            <input type="hidden" name="check_out" value="{{ check_out }}">
            <input type="hidden" name="guests" value="{{ guests }}">

            <button type="submit" class="btn btn-success btn-lg w-100 mt-2 fw-bold">I Have Paid</button>
        </form>

    </div>
</div>
{% endblock %}
